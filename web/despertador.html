<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="remotepad-despertador" content="1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>RemotePad — apagado</title>
<!-- La sirve el despertador (server/despertador.py) mientras el servidor de
     RemotePad está apagado. Es independiente de app.js: sin dependencias. -->
<style>
  :root {
    --bg: #080b11; --surface: #141c29; --line: #24304a; --text: #e8eef8;
    --muted: #8e9cb5; --accent: #4f8cff; --accent-2: #22d3a6; --danger: #ff5f6d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(90% 70% at 50% 30%, #131c2c, var(--bg) 75%);
  }
  .tarjeta {
    width: min(100%, 380px);
    padding: 28px 22px;
    text-align: center;
    background: #0f1520;
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 20px 50px #0008;
  }
  .logo { width: 56px; height: 56px; color: var(--accent); }
  h1 { margin: 10px 0 4px; font-size: 1.45rem; }
  .estado {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 18px;
    color: var(--muted);
    font-size: .92rem;
  }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
           box-shadow: 0 0 0 3px #ff5f6d22; }
  .punto.arrancando { background: #ffc65c; box-shadow: 0 0 0 3px #ffc65c22;
                      animation: latir 1s ease-in-out infinite; }
  @keyframes latir { 50% { opacity: .35; } }
  button {
    width: 100%;
    padding: 15px;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, #5b95ff, #3d78ec);
    border: 0;
    border-radius: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: .55; }
  .mensaje { min-height: 1.5em; margin: 14px 0 0; font-size: .9rem; color: var(--muted); }
  .mensaje.error { color: var(--danger); }
  .tiny { margin-top: 18px; font-size: .78rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="tarjeta">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="6" y="3" width="36" height="42" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M24 9v13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M17 14h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    </svg>
    <h1>RemotePad</h1>
    <div class="estado"><span class="punto" id="punto"></span><span id="estado">Apagado en la PC</span></div>
    <button id="encender" type="button">Encender RemotePad</button>
    <p class="mensaje" id="mensaje" role="status"></p>
    <p class="tiny">La PC tiene que estar encendida y con tu sesión iniciada.
      En cuanto RemotePad arranque, esta pantalla se convierte sola en el touchpad.</p>
  </main>
<script>
'use strict';
(function () {
  const boton = document.getElementById('encender');
  const mensaje = document.getElementById('mensaje');
  const punto = document.getElementById('punto');
  const estado = document.getElementById('estado');
  let esperando = null;

  function decir(texto, error) {
    mensaje.textContent = texto;
    mensaje.classList.toggle('error', !!error);
  }

  // El acceso que guardó la app al entrar con el QR o el PIN (mismo origen).
  function token() {
    try { return localStorage.getItem('remotepad.token') || ''; } catch (e) { return ''; }
  }

  // Cuando contesta el servidor de verdad (sin la cabecera del despertador),
  // se carga la app.
  function vigilar() {
    clearInterval(esperando);
    const inicio = Date.now();
    esperando = setInterval(function () {
      fetch('/?comprobar=' + Date.now(), { cache: 'no-store' })
        .then(function (r) {
          if (r.ok && r.headers.get('X-RemotePad-Despertador') !== '1') {
            clearInterval(esperando);
            location.replace('/?v=' + Date.now());
          }
        })
        .catch(function () { /* el puerto está cambiando de manos */ });
      if (Date.now() - inicio > 60000) {
        clearInterval(esperando);
        punto.classList.remove('arrancando');
        estado.textContent = 'Apagado en la PC';
        boton.disabled = false;
        decir('RemotePad no ha arrancado. Mira la PC o inténtalo otra vez.', true);
      }
    }, 1000);
  }

  boton.addEventListener('click', function () {
    boton.disabled = true;
    decir('Avisando a la PC…');
    fetch('/__despertador/encender', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token() }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.ok) {
          boton.disabled = false;
          decir(res.d.error || 'La PC no ha querido encender RemotePad.', true);
          return;
        }
        punto.classList.add('arrancando');
        estado.textContent = 'Arrancando…';
        decir('Encendiendo RemotePad en la PC. Un momento…');
        vigilar();
      })
      .catch(function () {
        boton.disabled = false;
        decir('No hay conexión con la PC. ¿Está encendida y en la misma WiFi?', true);
      });
  });

  if (!token()) {
    decir('Este celular aún no tiene acceso: entra una vez con el QR o el PIN '
      + 'mientras RemotePad está encendido.', false);
  }
})();
</script>
</body>
</html>
